<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#12151c" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Hero LCP: una sola imagen por viewport. La principal usa SIEMPRE Hero1
      (horizontal): el cliente pidió no repetir hero2 (la instantánea diagonal
      usa hero2, que es lazy/decorativa y no se precarga). Archivos optimizados
      en /public/img/hero{1,2,3}.{webp,jpg} (fuente: /src/assets/hero/Hero*.jpg).
    -->
    <link
      rel="preload"
      as="image"
      href="/img/hero1.webp"
      type="image/webp"
      fetchpriority="high"
    />
    <title>Servicio Lavadoras | Reparación de Línea Blanca a Domicilio en CDMX</title>
    <meta
      name="description"
      content="Reparación de lavadoras, refrigeradores, estufas y secadoras a domicilio en CDMX y zona metropolitana. Servicio especializado en Samsung, LG, Daewoo y Winnia. Revisión y cotización a domicilio el mismo día."
    />
    <script>
      // Aplica el tema del sistema antes del primer paint para evitar flash.
      ;(function () {
        try {
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var mode = dark ? 'dark' : 'light'
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = mode
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
