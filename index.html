<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#12151c" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="preload"
      as="image"
      href="/img/hero-reparacion.avif"
      type="image/avif"
      fetchpriority="high"
    />
    <title>TecServi | Reparación de Línea Blanca a Domicilio en CDMX</title>
    <meta
      name="description"
      content="Reparación de lavadoras, refrigeradores, estufas y secadoras a domicilio en CDMX y zona metropolitana. Servicio especializado en Samsung, LG y Mabe. Diagnóstico y cotización antes de reparar."
    />
    <script>
      // Aplica el tema del sistema antes del primer paint para evitar flash.
      ;(function () {
        try {
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var mode = dark ? 'dark' : 'light'
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = mode
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
